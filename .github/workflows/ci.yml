name: CI

# Run on PRs and on master so docker-publish can require a green test gate.
on:
  pull_request:
  push:
    branches:
      - master
      - 'chore/**'
      - 'fix/**'
      - 'feat/**'
  workflow_dispatch:

# Prevent wasted/racing builds: cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: unit-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # cache reads package-lock.json — now committed (reproducible build).

      # Root deps first — tests import from src/ and open-sse/
      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      # --legacy-peer-deps: npm 10.9.8 (Node 22.23.2 on ubuntu-latest) crashes
      # arborist `#loadPeerSet` (`edgesOut` of null) on vitest 4.1.x peer sets
      # (npm/cli#8261). Reproduced on a git-archive clone with no tests lockfile.
      # Do NOT switch this to `npm ci` — tests/package-lock.json is gitignored
      # and `npm ci` without it already took master red (#284).
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund --legacy-peer-deps

      # Focused smoke: new observability coverage + a small stable unit set.
      # Full suite is not all-green on a plain checkout (known-fails baseline);
      # do not use raw full vitest as a hard gate until known-fails is wired in CI.
      - name: Run unit smoke tests
        working-directory: tests
        run: |
          npx vitest run \
            unit/request-detail-token-stats.test.js \
            unit/capabilities.test.js \
            unit/dashboard-guard.test.js \
            unit/capabilities-grok-context.test.js \
            unit/tool-cap.test.js \
            unit/provider-variance-fixes.test.js \
            unit/antigravity-mitm.test.js \
            unit/antigravity-live-resolver.test.js
