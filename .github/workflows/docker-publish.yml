name: Build and Push Docker Image

# SUPPLY-CHAIN NOTE: a `v*` tag starts a privileged run (Docker Hub secret +
# packages:write), and the workflow file AT THE TAGGED REVISION is what executes.
# Anyone who can create tags can therefore publish, even without write access to
# master. That is not currently exploitable here — this repo has exactly one
# collaborator (the owner) and no other writers — so it is recorded rather than
# mitigated. If a second writer is ever added, gate publication behind a
# protected GitHub Environment and add a ruleset restricting `v*` tag creation;
# an ancestry check alone is not sufficient, since the tagged workflow is mutable.
on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

# Prevent race: only one build-and-push per ref at a time. For releases, do NOT
# cancel an in-flight push — tearing a tag upload mid-way leaves a partial image.
#
# Keep this keyed on github.ref, NOT github.sha. A release does fire two runs on
# one commit (master push, then the v* tag), but they publish DISJOINT tag sets —
# :latest and :sha-xxx are gated on {{is_default_branch}}, and the semver tag only
# resolves on the tag event — so there is no tag to race over (verified against
# the v0.15.24 release logs: the tag run pushed :0.15.24 only). Re-keying on the
# commit would merge those two into one group while SPLITTING consecutive master
# pushes into separate groups, letting commit A and commit B publish :latest
# concurrently — an older build finishing last would clobber the newer :latest.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: voravitl/888router

jobs:
  # Fail fast when this ref cannot produce a publishable tag at all — e.g. a
  # manual dispatch from a non-default branch, where neither the semver rule nor
  # the is_default_branch-gated :latest/:sha rules resolve. Without this the run
  # spends both full arch builds before the merge job discovers it has nothing to
  # tag. Cheap: metadata-action only, no checkout.
  tags:
    name: resolve tags
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}

      - name: Require at least one tag per image
        env:
          # Via env, never interpolated into the script body: a ref name is
          # attacker-influenced and may contain shell metacharacters. Same for the
          # multiline tag list.
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            found=0
            while IFS= read -r tag; do
              case "$tag" in
                "$image":*) found=1 ;;
              esac
            done <<< "$TAGS"
            if [ "$found" -eq 0 ]; then
              echo "::error::ref $GITHUB_REF resolves no publishable tag for $image — push to the default branch or a v* tag"
              exit 1
            fi
          done
          echo "tags resolve for both registries"

  # Test gate: do not publish an image if unit smoke fails.
  # (Same smoke set as .github/workflows/ci.yml — keep in sync.)
  test:
    name: unit-smoke
    needs: tags
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      # npm install, NOT npm ci: `tests/package-lock.json` is deliberately
      # gitignored (tests/.gitignore:2), so it does not exist in a fresh clone and
      # `npm ci` fails with EUSAGE. Switching to `npm ci` here broke master CI
      # exactly that way — the local lockfile made it look fine, but the check
      # that mattered was whether git tracks the file. Keep this in step with
      # .github/workflows/ci.yml, which uses npm install for the same reason.
      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Run unit smoke tests
        working-directory: tests
        run: |
          npx vitest run \
            unit/request-detail-token-stats.test.js \
            unit/capabilities.test.js \
            unit/dashboard-guard.test.js \
            unit/capabilities-grok-context.test.js \
            unit/tool-cap.test.js \
            unit/provider-variance-fixes.test.js \
            unit/kiro-models-context.test.js \
            unit/models-dev-modality.test.js \
            unit/retry-500-config.test.js \
            unit/request-details-retention.test.js

  # Per-architecture build on a NATIVE runner — no QEMU.
  #
  # WHY: the previous single-job build ran linux/arm64 under QEMU emulation
  # (setup-qemu-action + buildx), and that emulation was the direct cause of two
  # unrelated-looking failures on healthy commits: a stalled `npm ci`
  # (ETIMEDOUT) and `Cannot find module '../lightningcss.linux-arm64-musl.node'`
  # during `next build`. Neither reproduced natively — running the same lockfile
  # under `--platform linux/arm64` locally installed the arm64-musl binary and
  # required it successfully, including when the npm cache had been populated by
  # an amd64 pass first. The emulator, not the code or the lockfile, was the
  # variable. `ubuntu-24.04-arm` is a GitHub-hosted native arm64 runner, free for
  # public repositories, which removes the emulator from the path entirely.
  build:
    name: build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # Kept deliberately: the GHA cache backend v2 used by `cache-to: type=gha`
      # writes through the Actions cache service and fails without this scope.
      # Reviewed and retained rather than trimmed on the assumption that the
      # runtime cache token alone suffices — dropping it silently disables the
      # build cache, turning every build cold.
      actions: write
    strategy:
      # Never cancel a sibling: a half-built arch leaves the merge step with a
      # missing digest, and the fix is a full re-run either way.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the version is needed here; the tag list is applied by the merge job.
      - name: Extract version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Push by digest, untagged, to BOTH registries. Tags are attached once, by
      # the merge job, so a single-arch image can never occupy :latest even
      # briefly.
      #
      # Both names are required here: an OCI index references its children by
      # digest, and those child manifests and blobs must already exist in the
      # SAME repository the index is pushed to. Pushing only to Docker Hub and
      # then creating a GHCR index from Docker Hub digests would push an index
      # whose children GHCR does not have — a dangling manifest at best.
      # The quoted `"name=a,b"` form is how buildx takes multiple names without
      # the comma being read as an output-option separator.
      #
      # `continue-on-error` + the retry step below is a deliberate safety net,
      # NOT the fix: native runners remove the known flake source, but a registry
      # 5xx or a transient network fault can still lose a build, and a lost build
      # means :latest silently lags master until someone notices.
      - name: Build and push by digest
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scope: one shared scope would have the two jobs
          # overwrite each other's manifest on every run.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Retry build once
        id: retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,"name=${{ env.DOCKERHUB_IMAGE }},${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false
          sbom: false

      # A green job that needed two attempts must not look identical to one that
      # passed first time — a product build that is merely flaky would otherwise
      # publish silently. Surface it in the run summary.
      - name: Flag that the first attempt failed
        if: steps.build.outcome == 'failure'
        run: |
          {
            echo "### ⚠️ ${{ matrix.platform }} build needed a retry"
            echo ""
            echo "The first attempt failed and the retry succeeded. The image was"
            echo "published, but this is not a healthy build — check the failed"
            echo "step's log before treating it as noise."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=Retried build::${{ matrix.platform }} failed once before succeeding"

      # Hand the digest to the merge job. Fails loudly when both attempts
      # produced nothing — a missing digest must stop the release, not merge a
      # single-arch manifest and call it multi-arch.
      - name: Export digest
        env:
          # Select on OUTCOME, not on "first non-empty". A failed attempt can
          # still have populated its digest output — e.g. it pushed and then died
          # in a later export — and taking that value would ship the digest of
          # the run that failed rather than the retry that succeeded.
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          RETRY_DIGEST: ${{ steps.retry.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "$BUILD_OUTCOME" = "success" ]; then
            digest="$BUILD_DIGEST"
          else
            digest="$RETRY_DIGEST"
          fi
          if [ -z "$digest" ]; then
            echo "::error::no digest for $PLATFORM — both build attempts failed"
            exit 1
          fi
          mkdir -p /tmp/digests
          printf '%s' "$digest" > "/tmp/digests/$ARCH"
          echo "$digest"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into one multi-arch manifest and apply the tags.
  # Requires BOTH arch builds: `needs` fails this job if either did not succeed,
  # so a partial build never publishes. A single-arch image pulls fine but fails
  # to run on the other architecture ("exec format error"), which is exactly the
  # #196 regression this repo already fixed once.
  merge:
    name: merge manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            # Release tags: v0.10.1 → 0.10.1 (semver pattern strips leading v)
            type=semver,pattern={{version}}
            # Continuous deploy: every master push → :latest
            type=raw,value=latest,enable={{is_default_branch}}
            # Traceability for branch/master builds
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}

      # Validate the SOURCES before any public tag moves. Checking only that two
      # non-empty files exist is not enough: if the arm64 artifact carried an
      # amd64 digest, :latest would be updated to an amd64-only index and the
      # post-publish check would catch it only AFTER the tag had already moved,
      # with no rollback. So resolve each digest in each destination repository
      # and require it to be the architecture it claims.
      - name: Validate source digests
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            file="/tmp/digests/$arch"
            if [ ! -s "$file" ]; then
              echo "::error::missing digest for $arch — refusing to publish a partial manifest"
              exit 1
            fi
            digest=$(cat "$file")
            if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::malformed digest for $arch: $digest"
              exit 1
            fi
            # Distinct images: the same digest for both arches means one build
            # overwrote the other's artifact.
            eval "d_$arch=\$digest"

            for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
              # --format '{{.Image.*}}' and NOT --raw: the platform lives in the
              # config blob, so a raw single-platform manifest has no
              # .architecture field at all (verified against a published
              # child: its raw keys are config/layers/mediaType/schemaVersion).
              # buildx resolves the config for us with this format. Also fails
              # closed when the child is absent from this repository, which is
              # exactly what would leave a dangling index.
              got=$(docker buildx imagetools inspect "$image@$digest" \
                --format '{{.Image.OS}}/{{.Image.Architecture}}') || {
                echo "::error::$image@$digest is not present in $image"
                exit 1
              }
              if [ "$got" != "linux/$arch" ]; then
                echo "::error::$image@$digest claims $arch but reports $got"
                exit 1
              fi
              echo "ok  $image@$digest is $got"
            done
          done

          if [ "$d_amd64" = "$d_arm64" ]; then
            echo "::error::both arches report the same digest — one artifact clobbered the other"
            exit 1
          fi

      # One manifest list per image name, carrying every tag metadata-action
      # produced for that name, built from THAT registry's own children.
      - name: Create and push manifest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # while-read, not mapfile: keeps this snippet runnable (and therefore
          # testable) on bash 3.2 as well as the runner's bash 5.
          all_tags=()
          while IFS= read -r line; do
            [ -n "$line" ] && all_tags+=("$line")
          done <<< "$TAGS"

          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            # Children must come from the destination repository — an index may
            # only reference manifests that already live alongside it.
            refs=()
            for arch in amd64 arm64; do
              refs+=("$image@$(cat "/tmp/digests/$arch")")
            done

            tag_args=()
            for tag in "${all_tags[@]}"; do
              [ -n "$tag" ] || continue
              case "$tag" in
                "$image":*) tag_args+=("-t" "$tag") ;;
              esac
            done
            if [ "${#tag_args[@]}" -eq 0 ]; then
              echo "::error::no tags resolved for $image"
              exit 1
            fi
            # tag_args holds "-t" and its value per tag, so its length is twice
            # the tag count.
            echo "publishing $image with $(( ${#tag_args[@]} / 2 )) tag(s)"
            docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
          done

      # Defence in depth. Checking only that each tag carries SOME amd64 and SOME
      # arm64 descriptor is not enough: a stale tag left by an earlier release
      # would satisfy that even if this run's `imagetools create` never took
      # effect, and registry read-after-write lag makes exactly that observable.
      # So require each tag's platform descriptors to be EXACTLY this run's two
      # digests, with bounded retries to absorb propagation delay.
      - name: Verify every published tag points at this run's digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          amd64_digest=$(cat /tmp/digests/amd64)
          arm64_digest=$(cat /tmp/digests/arm64)

          all_tags=()
          while IFS= read -r line; do
            [ -n "$line" ] && all_tags+=("$line")
          done <<< "$TAGS"

          check_tag() {
            local tag="$1" raw
            raw=$(docker buildx imagetools inspect "$tag" --raw) || return 1
            jq -e \
              --arg amd "$amd64_digest" \
              --arg arm "$arm64_digest" \
              '
                def digests($arch):
                  [.manifests[]?
                    | select(.platform.os == "linux" and .platform.architecture == $arch)
                    | .digest];
                digests("amd64") == [$amd] and digests("arm64") == [$arm]
              ' >/dev/null <<<"$raw"
          }

          checked=0
          for tag in "${all_tags[@]}"; do
            [ -n "$tag" ] || continue
            ok=0
            for attempt in 1 2 3 4 5; do
              if check_tag "$tag"; then
                ok=1
                break
              fi
              echo "  attempt $attempt: $tag does not yet match — waiting"
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "::error::$tag does not reference this run's digests (amd64=$amd64_digest arm64=$arm64_digest)"
              docker buildx imagetools inspect "$tag" --raw || true
              exit 1
            fi
            echo "ok  $tag -> amd64=${amd64_digest:0:19}… arm64=${arm64_digest:0:19}…"
            checked=$((checked + 1))
          done

          if [ "$checked" -eq 0 ]; then
            echo "::error::verified no tags — the tag list was empty"
            exit 1
          fi
          echo "verified $checked tag(s)"
