name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

# Prevent race: only one build-and-push per ref at a time. For releases, do NOT
# cancel an in-flight push — tearing a tag upload mid-way leaves a partial image.
#
# Keep this keyed on github.ref, NOT github.sha. A release does fire two runs on
# one commit (master push, then the v* tag), but they publish DISJOINT tag sets —
# :latest and :sha-xxx are gated on {{is_default_branch}}, and the semver tag only
# resolves on the tag event — so there is no tag to race over (verified against
# the v0.15.24 release logs: the tag run pushed :0.15.24 only). Re-keying on the
# commit would merge those two into one group while SPLITTING consecutive master
# pushes into separate groups, letting commit A and commit B publish :latest
# concurrently — an older build finishing last would clobber the newer :latest.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: voravitl/888router

jobs:
  # Test gate: do not publish an image if unit smoke fails.
  # (Same smoke set as .github/workflows/ci.yml — keep in sync.)
  test:
    name: unit-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Run unit smoke tests
        working-directory: tests
        run: |
          npx vitest run \
            unit/request-detail-token-stats.test.js \
            unit/capabilities.test.js \
            unit/dashboard-guard.test.js \
            unit/capabilities-grok-context.test.js \
            unit/tool-cap.test.js \
            unit/provider-variance-fixes.test.js \
            unit/kiro-models-context.test.js \
            unit/models-dev-modality.test.js \
            unit/retry-500-config.test.js \
            unit/request-details-retention.test.js

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    # Bound the run. Without this the job inherits the 360-minute default, so a
    # hung multi-arch build (QEMU arm64 emulation + a stalled `npm ci`) sat
    # in_progress for hours and, with cancel-in-progress:false, blocked the
    # concurrency group behind it. Healthy multi-arch builds measured 12-18 min
    # across the last 8 successful runs, so 45 min leaves ~2.5x headroom.
    timeout-minutes: 45
    # Least privilege: only this job needs registry + cache write access.
    permissions:
      contents: read
      packages: write
      actions: write   # required for type=gha build cache

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # QEMU for multi-arch (arm64) builds — required before buildx
      - uses: docker/setup-qemu-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            # Release tags: v0.10.1 → 0.10.1 (semver pattern strips leading v)
            type=semver,pattern={{version}}
            # Continuous deploy: every master push → :latest
            type=raw,value=latest,enable={{is_default_branch}}
            # Traceability for branch/master builds
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Multi-arch: publish both amd64 and arm64 so anyone can self-host on
          # x86_64 VPS/cloud OR Apple Silicon — a single-arch (arm64-only) image
          # pulls fine but fails to run on Intel/AMD hosts ("exec format error").
          # QEMU (setup-qemu-action above) + buildx build a combined manifest;
          # clients select the arch matching their runtime, so order is cosmetic.
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

      # Cleanup: prune build cache and dangling images after a SUCCESSFUL build.
      # Deliberately not `if: always()` — the runner is ephemeral and discarded
      # either way, so pruning after a failure or a timeout buys nothing.
      - name: Cleanup Docker build cache
        run: |
          docker builder prune -f
          docker image prune -f
