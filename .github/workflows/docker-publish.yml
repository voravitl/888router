name: Build and Push Docker Image

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

# Prevent race: only one build-and-push per ref at a time. For releases, do NOT
# cancel an in-flight push — tearing a tag upload mid-way leaves a partial image.
#
# Keep this keyed on github.ref, NOT github.sha. A release does fire two runs on
# one commit (master push, then the v* tag), but they publish DISJOINT tag sets —
# :latest and :sha-xxx are gated on {{is_default_branch}}, and the semver tag only
# resolves on the tag event — so there is no tag to race over (verified against
# the v0.15.24 release logs: the tag run pushed :0.15.24 only). Re-keying on the
# commit would merge those two into one group while SPLITTING consecutive master
# pushes into separate groups, letting commit A and commit B publish :latest
# concurrently — an older build finishing last would clobber the newer :latest.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: voravitl/888router

jobs:
  # Test gate: do not publish an image if unit smoke fails.
  # (Same smoke set as .github/workflows/ci.yml — keep in sync.)
  test:
    name: unit-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install root dependencies
        run: npm ci --no-audit --no-fund

      - name: Install test dependencies
        working-directory: tests
        run: npm install --no-audit --no-fund

      - name: Run unit smoke tests
        working-directory: tests
        run: |
          npx vitest run \
            unit/request-detail-token-stats.test.js \
            unit/capabilities.test.js \
            unit/dashboard-guard.test.js \
            unit/capabilities-grok-context.test.js \
            unit/tool-cap.test.js \
            unit/provider-variance-fixes.test.js \
            unit/kiro-models-context.test.js \
            unit/models-dev-modality.test.js \
            unit/retry-500-config.test.js \
            unit/request-details-retention.test.js

  # Per-architecture build on a NATIVE runner — no QEMU.
  #
  # WHY: the previous single-job build ran linux/arm64 under QEMU emulation
  # (setup-qemu-action + buildx), and that emulation was the direct cause of two
  # unrelated-looking failures on healthy commits: a stalled `npm ci`
  # (ETIMEDOUT) and `Cannot find module '../lightningcss.linux-arm64-musl.node'`
  # during `next build`. Neither reproduced natively — running the same lockfile
  # under `--platform linux/arm64` locally installed the arm64-musl binary and
  # required it successfully, including when the npm cache had been populated by
  # an amd64 pass first. The emulator, not the code or the lockfile, was the
  # variable. `ubuntu-24.04-arm` is a GitHub-hosted native arm64 runner, free for
  # public repositories, which removes the emulator from the path entirely.
  build:
    name: build (${{ matrix.platform }})
    needs: test
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      actions: write   # required for type=gha build cache
    strategy:
      # Never cancel a sibling: a half-built arch leaves the merge step with a
      # missing digest, and the fix is a full re-run either way.
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Only the version is needed here; the tag list is applied by the merge job.
      - name: Extract version
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      # Push by digest, untagged. Tags are attached once, by the merge job, so a
      # single-arch image can never occupy :latest even briefly.
      #
      # `continue-on-error` + the retry step below is a deliberate safety net,
      # NOT the fix: native runners remove the known flake source, but a registry
      # 5xx or a transient network fault can still lose a build, and a lost build
      # means :latest silently lags master until someone notices.
      - name: Build and push by digest
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-arch cache scope: one shared scope would have the two jobs
          # overwrite each other's manifest on every run.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Retry build once
        id: retry
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.DOCKERHUB_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: false
          sbom: false

      # Hand the digest to the merge job. Fails loudly when both attempts
      # produced nothing — a missing digest must stop the release, not merge a
      # single-arch manifest and call it multi-arch.
      - name: Export digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest || steps.retry.outputs.digest }}"
          if [ -z "$digest" ]; then
            echo "::error::no digest for ${{ matrix.platform }} — both build attempts failed"
            exit 1
          fi
          mkdir -p /tmp/digests
          echo -n "$digest" > "/tmp/digests/${{ matrix.arch }}"
          echo "$digest"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into one multi-arch manifest and apply the tags.
  # Requires BOTH arch builds: `needs` fails this job if either did not succeed,
  # so a partial build never publishes. A single-arch image pulls fine but fails
  # to run on the other architecture ("exec format error"), which is exactly the
  # #196 regression this repo already fixed once.
  merge:
    name: merge manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            # Release tags: v0.10.1 → 0.10.1 (semver pattern strips leading v)
            type=semver,pattern={{version}}
            # Continuous deploy: every master push → :latest
            type=raw,value=latest,enable={{is_default_branch}}
            # Traceability for branch/master builds
            type=sha,prefix=sha-,format=short,enable={{is_default_branch}}

      # Assert both arches arrived before publishing anything. `needs` already
      # gates on job success, but an empty artifact would otherwise yield a
      # one-arch manifest that looks healthy.
      - name: Verify both digests present
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            if [ ! -s "/tmp/digests/$arch" ]; then
              echo "::error::missing digest for $arch — refusing to publish a partial manifest"
              exit 1
            fi
            echo "$arch $(cat "/tmp/digests/$arch")"
          done

      # One manifest list per image name, carrying every tag metadata-action
      # produced for that name.
      - name: Create and push manifest
        run: |
          set -euo pipefail
          refs=""
          for arch in amd64 arm64; do
            refs="$refs ${DOCKERHUB_IMAGE}@$(cat "/tmp/digests/$arch")"
          done

          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            tag_args=""
            while read -r tag; do
              [ -n "$tag" ] || continue
              case "$tag" in
                "$image":*) tag_args="$tag_args -t $tag" ;;
              esac
            done <<< '${{ steps.meta.outputs.tags }}'
            if [ -z "$tag_args" ]; then
              echo "::error::no tags resolved for $image"
              exit 1
            fi
            echo "publishing $image:"
            # shellcheck disable=SC2086
            docker buildx imagetools create $tag_args $refs
          done

      # Prove the published manifest actually carries both architectures, rather
      # than trusting that the create call did what it was asked.
      - name: Verify published manifest is multi-arch
        run: |
          set -euo pipefail
          ref="${DOCKERHUB_IMAGE}:${{ steps.meta.outputs.version }}"
          echo "inspecting $ref"
          out=$(docker buildx imagetools inspect "$ref" --raw)
          for arch in amd64 arm64; do
            echo "$out" | grep -q "\"architecture\":\"$arch\"" || {
              echo "::error::published manifest is missing linux/$arch"
              exit 1
            }
          done
          echo "manifest carries both amd64 and arm64"
