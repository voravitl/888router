apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 888router-default-deny
  namespace: 888router
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Ingress controller + DNS + intra-namespace for the gateway only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 888router-gateway-access
  namespace: 888router
spec:
  podSelector:
    matchLabels:
      app: 888router
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - podSelector:
            matchLabels:
              app: 888router
      ports:
        - protocol: TCP
          port: 20128
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: headroom
      ports:
        - protocol: TCP
          port: 8787
    - to:
        - podSelector:
            matchLabels:
              app: searxng
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app: 888router
      ports:
        - protocol: TCP
          port: 20128
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
# Dependencies accept traffic only from the gateway + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: 888router-dependencies-access
  namespace: 888router
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [headroom, searxng]
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: 888router
      ports:
        - protocol: TCP
          port: 8787
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
