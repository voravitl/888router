apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: 888router-ingress
  namespace: 888router
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "128m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    # 1. Host-based routing for local / org domains
    - host: router.k8s.orb.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: router-888
                port:
                  number: 20128
    - host: 888router.k8s.orb.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: router-888
                port:
                  number: 20128
    - host: 888router.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: router-888
                port:
                  number: 20128
    # 2. Catch-all rule for IP or any arbitrary host header
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: router-888
                port:
                  number: 20128
