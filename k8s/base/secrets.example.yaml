apiVersion: v1
kind: Secret
metadata:
  name: 888router-secrets
  namespace: 888router
type: Opaque
stringData:
  JWT_SECRET: "replace-with-your-jwt-secret"
  API_KEY_SECRET: "endpoint-proxy-api-key-secret"
  INITIAL_PASSWORD: "replace-with-your-initial-password"
  MACHINE_ID_SALT: "endpoint-proxy-salt"
  SEARXNG_SECRET: "replace-with-your-searxng-secret"
