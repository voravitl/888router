apiVersion: apps/v1
kind: Deployment
metadata:
  name: headroom
  namespace: 888router
  labels:
    app: headroom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headroom
  template:
    metadata:
      labels:
        app: headroom
    spec:
      # Upstream images run as root; runAsNonRoot would break them. Keep
      # drop-all capabilities + seccomp as the hardening that applies.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headroom
          # v0.39.1. The project moved org chopratejas -> headroomlabs-ai; the old
          # ghcr.io/chopratejas/headroom package is frozen at v0.27.0 (2026-06-22).
          # v0.28.0 is the release that offloaded POST /v1/compress onto the bounded
          # compression executor. Before it, handle_compress ran pipeline.apply()
          # inline on the single event loop, so one large payload froze every
          # response including /livez — which is what got this pod SIGKILLed
          # (exit 137) seven times in 13h and re-imported litellm (7.8 CPU-s) on
          # each restart. Digest pinned, not the tag, so the next upgrade is explicit.
          image: ghcr.io/headroomlabs-ai/headroom@sha256:efe30f7c99e40021cd7a9ef1558835662d838d7ea663e41b7308bce1f48cbe75
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8787
              name: http
          resources:
            limits:
              cpu: "2"
              memory: 4096Mi
            requests:
              cpu: "200m"
              memory: 1024Mi
          env:
            - name: OMP_NUM_THREADS
              value: "2"
            - name: OPENBLAS_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            - name: VECLIB_MAXIMUM_THREADS
              value: "2"
            - name: NUMEXPR_NUM_THREADS
              value: "2"
            # os.cpu_count() reports the HOST's cores (10 here), never the cgroup
            # quota below, so the pool sizes itself to 10 CPU-bound threads on a
            # 2-core limit. Match it to cpu.limits.cpu instead of letting the
            # container oversubscribe the node.
            #
            # NOTE: do NOT use HEADROOM_PROXY_CONFIG_JSON for this. That name is
            # headroom's own internal hand-off: run_server() writes the CLI config
            # into it and relaunches uvicorn via create_app_from_env only for
            # --workers > 1. In single-worker mode nothing reads it, and in
            # multi-worker mode _proxy_config_from_env() takes it wholesale and
            # would reset --host back to the 127.0.0.1 dataclass default, making
            # the Service unroutable. HEADROOM_COMPRESSION_MAX_WORKERS is the
            # supported knob (click option, envvar=, defaults to cpu_count).
            - name: HEADROOM_COMPRESSION_MAX_WORKERS
              value: "2"
            # Bounds ONE compression. The router abandons /v1/compress after
            # HEADROOM_TIMEOUT_MS (2s, default) but Python cannot preempt the
            # executor thread — it runs to completion regardless. Left at the
            # 30s default that is up to 28s of orphaned CPU per abandoned
            # request. Measured throughput is ~0.2ms/KB, so 3s still covers
            # ~15MB while capping the waste at ~1s.
            - name: HEADROOM_COMPRESSION_TIMEOUT_SECONDS
              value: "3"
          livenessProbe:
            httpGet:
              path: /livez
              port: 8787
            initialDelaySeconds: 20
            periodSeconds: 30
            # The proxy is CPU-bound by design: two compression workers can
            # saturate both allotted cores and starve the event loop that has
            # to answer this probe. A busy proxy is not a dead proxy, so give
            # it room before declaring it hung. Kept far below the
            # crashloop-of-doomed-pod threshold — the real fix is the image
            # above, this only stops a healthy burst from being SIGKILLed.
            timeoutSeconds: 30
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /livez
              port: 8787
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /livez
              port: 8787
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
---
apiVersion: v1
kind: Service
metadata:
  name: headroom
  namespace: 888router
spec:
  selector:
    app: headroom
  ports:
    - protocol: TCP
      port: 8787
      targetPort: 8787
      name: http
