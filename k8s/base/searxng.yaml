apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: 888router
  labels:
    app: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      # Upstream image runs as root (entrypoint does update-ca-certificates);
      # runAsNonRoot would break it. Keep drop-all + seccomp hardening.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: searxng
          image: searxng/searxng@sha256:f1aca3f61c7ff4552b8d54c0ab7fb458e907b78f51c503210cf450c900adca2c
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: SEARXNG_BASE_URL
              value: "http://searxng:8080"
            - name: SEARXNG_SECRET
              valueFrom:
                secretKeyRef:
                  name: 888router-secrets
                  key: SEARXNG_SECRET
          # Inject the real secret_key into the mounted settings.yml at startup:
          # SearXNG only auto-generates a secret when the file is ABSENT, but our
          # ConfigMap mount always presents a file — so without this the public
          # placeholder would ship as the real key. Fail closed on missing secret.
          # NOTE: the ConfigMap mount is read-only, so copy to a writable path
          # first (sed -i cannot rename over a mounted file: "Device or resource
          # busy"). SEARXNG_CONFIG_PATH redirects the entrypoint to the copy.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              case "${SEARXNG_SECRET:-}" in
                ""|*change-me*|*placeholder*|*example*|*REPLACED_AT_STARTUP*)
                  echo "FATAL: SEARXNG_SECRET is missing or a placeholder" >&2
                  exit 1
                  ;;
              esac
              # Internal __-prefixed var is what entrypoint.sh actually reads
              # (__SEARXNG_CONFIG_PATH, default /etc/searxng).
              mkdir -p /tmp/searxng-config
              cp /etc/searxng/settings.yml /tmp/searxng-config/settings.yml
              sed -i "s|REPLACED_AT_STARTUP_FROM_SEARXNG_SECRET|${SEARXNG_SECRET}|g" /tmp/searxng-config/settings.yml
              grep -q "REPLACED_AT_STARTUP_FROM_SEARXNG_SECRET" /tmp/searxng-config/settings.yml && {
                echo "FATAL: secret_key placeholder was not replaced" >&2
                exit 1
              }
              export __SEARXNG_CONFIG_PATH=/tmp/searxng-config
              exec /usr/local/searxng/entrypoint.sh
          volumeMounts:
            - name: searxng-settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
      volumes:
        - name: searxng-settings
          configMap:
            name: searxng-settings
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: 888router
spec:
  selector:
    app: searxng
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
