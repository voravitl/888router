services:
  888router:
    # Published by CI (.github/workflows/docker-publish.yml): every master push
    # builds :latest, releases tag semver (v0.14.11 → 0.14.11), plus sha-<hash>.
    # The image is multi-arch (linux/amd64 + linux/arm64).
    #
    # To build from this repo instead of pulling the published image (e.g. a
    # fork or a local change), uncomment `build:` — compose then builds from
    # ./Dockerfile and tags it locally. If both image: and build: are set,
    # compose builds the image and tags it as the image: name (no pull needed).
    image: voravitl/888router:latest
    # build:
    #   context: .
    #   args:
    #     BUILD_VERSION: "0.14.12"
    container_name: 888router
    restart: always
    ports:
      - "20128:20128"
    labels:
      - "dev.orbstack.http-port=20128"
    volumes:
      - 888router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
      # Public origin used to absolutize skill markdown links. Set it in .env
      # (see .env.example) — e.g. NINEROUTER_PUBLIC_URL=http://localhost:20128
      # for localhost access, or https://gateway.example.com behind a
      # proxy/tunnel. Empty default: when unset the raw route FAILS CLOSED
      # (no rewrite) in production rather than embedding a wrong origin.
      NINEROUTER_PUBLIC_URL: "${NINEROUTER_PUBLIC_URL:-}"
      # Point SearXNG provider at the compose service (internal port 8080),
      # not localhost — the gateway is a container and localhost = itself.
      SEARXNG_BASE_URL: http://searxng:8080/search
    depends_on:
      - headroom
      - searxng
    # Liveness via the version API — tells orchestration when the gateway is
    # actually serving (not just the container started).
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"
    environment:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      VECLIB_MAXIMUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    # Image default checks /readyz (includes upstream) with a 5s timeout — flaps
    # unhealthy when Anthropic is slow. Liveness is enough for "is the proxy up".
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/livez"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    # Internal-only: SearXNG is a search proxy — do NOT publish to a public
    # host without auth (open-proxy/SSR abuse risk). Expose only for local dev
    # via a separate override. The gateway reaches it by service name.
    # ports:
    #   - "8888:8080"
    # Config is mounted from the repo (reproducible) instead of a Docker
    # volume. Read-only: the app must not rewrite settings.yml.
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080
      # Require the secret — never ship a known-in-git default (CSRF/session risk).
      # SearXNG overrides secret_key from this env at runtime.
      SEARXNG_SECRET: "${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}"
    healthcheck:
      # Image ships wget (not curl); --spider fails on non-2xx.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Search engines may be flaky; a full readiness gate would flap the app.
    # Liveness ("is SearXNG up") is enough for the gateway to route queries.

volumes:
  888router-data:
    name: 888router-data
