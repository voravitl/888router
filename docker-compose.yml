services:
  # The gateway: the only one this file runs. Host port 20129 maps to the
  # app's container port 20128.
  #
  # Published by CI (.github/workflows/docker-publish.yml): every master push
  # builds :latest and sha-<hash>; a version bump also publishes :<version>.
  # The image is multi-arch (linux/amd64 + linux/arm64).
  #
  # To build from this repo instead of pulling the published image (e.g. a
  # fork or a local change), uncomment `build:` — compose then builds from
  # ./Dockerfile and tags it locally. If both image: and build: are set,
  # compose builds the image and tags it as the image: name (no pull needed).
  #
  # The volume `888route-data` holds the gateway DB. SQLite is single-writer:
  # never mount it into a second gateway container.
  #
  # Watchtower tracks THIS service (label below + `888route` name filter), so a
  # new published :latest is pulled and recreated automatically.
  888route:
    image: voravitl/888router:latest
    # build:
    #   context: .
    container_name: 888route
    restart: "no"
    ports:
      - "20129:20128"
    labels:
      # The label value is the port INSIDE the container, not the published host
      # port — OrbStack dials container-IP:<label> to build its HTTP proxy. The
      # app listens on 20128; the host port is 20129. Getting this backwards
      # yields "proxy error: dial tcp 10.x.x.x:20129: connection refused" while
      # curl on the host still works.
      - "dev.orbstack.http-port=20128"
      # Watchtower re-pulls this container when the published image changes.
      # Only 888route opts in — searxng stays pinned to avoid
      # third-party breaking changes dropping in unannounced.
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - 888route-data:/app/data
    # Copy .env.example to .env.route and fill in the secrets. This instance's
    # copy was generated from the retired k8s secret + configmap by
    # scripts/k8s-sync-secret.sh --pull. gitignored, never committed.
    env_file:
      - .env.route
    environment:
      # Container-internal invariants and compose-network service names. The
      # public origin (BASE_URL / NINEROUTER_PUBLIC_URL) comes from .env.route
      # and points at http://localhost:20129.
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      RTK_HARD_CAP_BYTES: "65536"
      # Let RTK run on Claude Code traffic, which is otherwise preserved
      # byte-for-byte (chatCore.js preserveRequestInput). Only safe together
      # with RTK_LOSSY=off: that keeps raw file content byte-identical and
      # applies only the format-only filters (git status/diff/log, ls, grep,
      # build output), which summarise tool reports rather than dropping code.
      RTK_ON_PRESERVED_INPUT: "on"
      RTK_LOSSY: "off"
      SEARXNG_BASE_URL: http://searxng:8080/search
    depends_on:
      - searxng
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/api/version').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: "no"
    # Internal-only: SearXNG is a search proxy — do NOT publish to a public
    # host without auth (open-proxy/SSR abuse risk). Expose only for local dev
    # via a separate override. The gateway reaches it by service name.
    # ports:
    #   - "8888:8080"
    # Config is mounted from the repo (reproducible) instead of a Docker
    # volume. Read-only: the app must not rewrite settings.yml.
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://searxng:8080
      # Require the secret — never ship a known-in-git default (CSRF/session risk).
      # SearXNG overrides secret_key from this env at runtime.
      SEARXNG_SECRET: "${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Image ships wget (not curl); --spider fails on non-2xx.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    # Search engines may be flaky; a full readiness gate would flap the app.
    # Liveness ("is SearXNG up") is enough for the gateway to route queries.

  # Optional context-compression proxy. Disabled by default: it costs ~1GB RAM
  # and 1.5 CPU, and nothing calls it unless headroomEnabled is turned on in
  # settings. Kept in compose so the feature is testable — `docker compose up -d
  # headroom` then enable the toggle. Loopback-only on the host because
  # /v1/compress is unauthenticated; the gateway reaches it over the compose
  # network instead.
  headroom:
    image: ghcr.io/headroomlabs-ai/headroom:latest
    container_name: headroom
    restart: "no"
    profiles: ["headroom"]
    ports:
      - "127.0.0.1:8787:8787"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    environment:
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      VECLIB_MAXIMUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
      # v0.39.1 binds 127.0.0.1 by default, so a sibling container got
      # ECONNREFUSED while the in-container healthcheck stayed green (#515).
      HEADROOM_HOST: "0.0.0.0"
      # ...and it restricts /v1/compress to loopback peers. Without this every
      # compress is refused and the toggle silently no-ops.
      HEADROOM_COMPRESS_ALLOW_REMOTE: "1"
      # Default pool size is the host's core count, not the CPU limit above;
      # bound it, and bound how long one compression may hold a request.
      HEADROOM_COMPRESSION_MAX_WORKERS: "2"
      HEADROOM_COMPRESSION_TIMEOUT_SECONDS: "30"
      # Default mode is "cache": it freezes prior turns to protect the provider
      # prefix cache, so /v1/compress is a no-op (router:noop, ratio 1.0).
      # "token" mode prioritises compression.
      HEADROOM_MODE: "token"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # /readyz includes the upstream and flaps when Anthropic is slow; /livez is
    # enough for "is the proxy up".
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/livez"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Auto-updater: re-pulls and recreates containers carrying the
  # com.centurylinklabs.watchtower.enable=true label AND matching the name
  # filter (the 888route service above). Everything else — searxng —
  # is deliberately left out. A name filter plus the label is belt-and-braces:
  # the label is how we opt in, the name is how we scope to exactly one
  # container on a host that may run other compose projects.
  # Polls Docker Hub every 5m (WATCHTOWER_POLL_INTERVAL=300).
  #
  # The upstream containrrr/watchtower repo was archived 2025-12-17 (no more
  # fixes). The image is pinned by DIGEST so a floating :latest cannot silently
  # move to a newer-but-unmaintained build. If this becomes a problem, the
  # downgrade path is dropping this service and going back to manual
  # `docker compose pull && up -d`.
  watchtower:
    image: containrrr/watchtower@sha256:6dd50763bbd632a83cb154d5451700530d1e44200b268a4e9488fefdfcf2b038
    container_name: watchtower
    restart: "no"
    command:
      - 888route
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      # OrbStack rejects Docker API clients older than 1.40; the watchtower image
      # ships a go-dockerclient that defaults to 1.25 and crashes on startup
      # ("client version 1.25 is too old"). Override the client API version so
      # it negotiates one the daemon accepts. 1.40 is the floor and works.
      DOCKER_API_VERSION: "1.40"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

volumes:
  # `888route-data` holds the gateway DB (owns its creation via normal compose
  # volume lifecycle).
  888route-data:
    name: 888route-data
